# Pages CMS configuration for findintegrity.com
# Staff edit at https://app.pagescms.org. Saving commits to GitHub,
# and Netlify rebuilds the page (about 1 minute).
# Formatting in text boxes: *italic*, **bold**, [link text](https://...), and Enter for a new line.

settings:
  commit:
    identity: user

media:
  input: public/images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  # ---------------------------------------------------------------
  - name: meeting
    label: "1. Meeting time, place and contact"
    type: file
    path: content/meeting.json
    format: json
    fields:
      - name: day
        label: Meeting day
        type: string
        description: "Example: Tuesdays"
      - name: time
        label: Meeting time
        type: string
        description: "Example: 6:30 to 8:00 PM"
      - name: timeNote
        label: Time note
        type: string
        description: "Short note after the time, like: every week. Leave blank to hide."
      - name: venue
        label: Room or building
        type: string
        description: "Example: CCC Student Center"
      - name: address
        label: Address
        type: text
        description: "Press Enter for a new line. The top of the page shows the street and city from the last line."
      - name: directionsUrl
        label: Directions link
        type: string
        description: "Google Maps link for the Get Directions button."
      - name: contactName
        label: Contact name
        type: string
        description: "The first name is used on the Text buttons (Text Jon)."
      - name: contactRole
        label: Contact role
        description: Shown under the contact's name on the contact card.
        type: string
      - name: phone
        label: Contact cell phone
        type: string
        description: "Format like 402-306-0847. Every Text button on the page uses this number."
      - name: email
        label: Contact email
        type: string
        description: "Leave blank to hide the email link and button."
      - name: contactLabel
        label: Contact card label
        description: The small all-caps line at the top of the contact card.
        type: string
      - name: contactText
        label: Contact card paragraph
        description: The short paragraph on the contact card, above the phone and email.
        type: text
      - name: eyebrow
        label: Section small label
        description: The small all-caps line above the meeting section heading.
        type: string
      - name: heading
        label: Section heading
        description: The big heading of the meeting time and place section.
        type: string
      - name: showBuilding
        label: Show Student Center illustration
        type: boolean
        description: "Turn off if the group moves to a different building."
      - name: buildingCaption
        label: Illustration caption
        description: The small caption under the Student Center illustration.
        type: string

  # ---------------------------------------------------------------
  - name: top
    label: "2. Top of page"
    type: file
    path: content/top.json
    format: json
    fields:
      - name: eyebrow
        label: Small orange label
        description: The small orange all-caps line at the very top, above the big title.
        type: string
      - name: headline
        label: Big title, white part
        description: The first, white part of the big title at the top of the page.
        type: string
      - name: headlineAccent
        label: Big title, orange italic part
        description: The end of the big title, shown in orange italics.
        type: string
      - name: intro
        label: Intro paragraph
        description: The paragraph under the big title. Use **bold**, *italic* or [link text](https://...).
        type: text
      - name: primaryButton
        label: Orange button text
        type: string
        description: "Jumps to the meeting details."
      - name: secondaryButton
        label: Outline button text
        type: string
        description: "Opens a text message to the contact phone in section 1."
      - name: openGroupText
        label: Open group note
        type: string
        description: "Shows under Open Group in the info row."

  # ---------------------------------------------------------------
  - name: about
    label: "3. What is Men of Integrity?"
    type: file
    path: content/about.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the What is Men of Integrity heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading of the What is Men of Integrity section.
        type: string
      - name: lead
        label: First paragraph (larger)
        description: The larger first paragraph under the heading.
        type: text
      - name: body
        label: Second paragraph
        description: The regular-size paragraph after the larger one.
        type: text
      - name: openNote
        label: Green dot note
        description: The short note next to the green dot, under the paragraphs.
        type: string
      - name: verse
        label: Scripture verse
        type: text
        description: "Include the quotation marks. Leave blank to hide the verse card."
      - name: verseRef
        label: Scripture reference
        description: Shown under the scripture quote, for example Proverbs 27:17.
        type: string

  # ---------------------------------------------------------------
  - name: pillars
    label: "4. Mission (five commitments)"
    type: file
    path: content/pillars.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the mission heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading of the five commitments section.
        type: string
      - name: intro
        label: Intro paragraph
        description: The paragraph under the mission heading.
        type: text
      - name: items
        label: Commitments
        type: object
        description: "Numbers (01, 02...) are added automatically. Five fits the layout best."
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            label: Icon
            description: The small icon at the top of this commitment's card.
            type: select
            options:
              values: [shield, sprout, dawn, book, people, compass, anchor, lock]
          - name: title
            label: Title
            description: The bold title on this commitment's card.
            type: string
          - name: text
            label: Description
            description: The short paragraph under the title on the card.
            type: text

  # ---------------------------------------------------------------
  - name: story
    label: "5. Story video"
    type: file
    path: content/story.json
    format: json
    fields:
      - name: show
        label: Show this section
        description: Turn off to hide the whole story video section.
        type: boolean
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the story video heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading of the story video section.
        type: string
      - name: intro
        label: Intro paragraph
        description: The paragraph next to the video.
        type: text
      - name: title
        label: Video title
        type: string
        description: "Shows on the video cover and in the top menu."
      - name: coverLabel
        label: Small label above the video title
        description: The small line shown over the video cover, above its title.
        type: string
      - name: poster
        label: Cover image
        type: image
        description: "16:9 still from the video. Keep files under 2 MB. Larger photos are shrunk automatically after upload."
      - name: vimeoId
        label: Vimeo video number
        type: string
        description: "The number at the end of the Vimeo link. Example: 480879135"
      - name: hlsUrl
        label: Vimeo stream link (.m3u8)
        type: string
        description: "Powers the custom player. Leave blank to use Vimeo's standard player instead. Ask Eric if you're not sure."

  # ---------------------------------------------------------------
  - name: steps
    label: "6. First steps"
    type: file
    path: content/steps.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the first steps heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading of the first steps section.
        type: string
      - name: intro
        label: Intro paragraph
        description: The paragraph under the first steps heading.
        type: text
      - name: items
        label: Steps
        type: object
        description: "Step numbers are added automatically. Three fits the layout best."
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            description: The bold title of this numbered step.
            type: string
          - name: text
            label: Description
            description: The short paragraph under the step's title.
            type: text
          - name: linkText
            label: Link text
            description: The text of the arrow link at the bottom of the step. Leave blank for no link.
            type: string
          - name: linkUrl
            label: Link
            type: string
            description: "A web address, #visit for the meeting details, or #tab- plus a resource tab's first word (example: #tab-filters)."
      - name: reassureTitle
        label: Callout bold text
        description: The bold first words of the callout box under the steps.
        type: string
      - name: reassureText
        label: Callout text
        type: text
        description: "Leave blank to hide the callout."

  # ---------------------------------------------------------------
  - name: resources
    label: "7. Resources"
    type: file
    path: content/resources.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the resources heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading of the resources section.
        type: string
      - name: intro
        label: Intro paragraph
        description: The paragraph under the resources heading.
        type: text
      - name: categories
        label: Tabs
        type: object
        description: "Each tab is a category. Drag to reorder. The first tab shows by default."
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Tab name
            type: string
            description: "Start each tab with a different word. The first word is used for #tab- links."
          - name: intro
            label: Tab intro
            description: The short paragraph at the top of this tab, above its list.
            type: text
          - name: items
            label: Resources
            description: The resources listed in this tab, in order.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                description: The name of the resource as it appears in the list.
                type: string
              - name: by
                label: Author or note
                type: string
                description: "Optional. Shows under the title."
              - name: type
                label: Small label
                type: string
                description: "Example: Book, Podcast, YouTube, Website, Filter. The matching icon is added automatically."
              - name: url
                label: Link
                description: Where the resource opens. Paste the full https:// address.
                type: string
              - name: action
                label: Link word
                description: The word on the link button, like Visit, Read or Listen.
                type: select
                options:
                  values: [View, Listen, Watch, Visit]

  # ---------------------------------------------------------------
  - name: partners
    label: "8. For the betrayed partner"
    type: file
    path: content/partners.json
    format: json
    fields:
      - name: show
        label: Show this section
        description: Turn off to hide the whole section for betrayed partners.
        type: boolean
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above this section's heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading of the section for betrayed partners.
        type: string
      - name: text
        label: Paragraph
        description: The paragraph under the heading.
        type: text
      - name: books
        label: Books
        description: The recommended books listed in this section, in order.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            description: The book title, shown in bold.
            type: string
          - name: author
            label: Author
            description: Shown after the title.
            type: string
          - name: url
            label: Link
            description: Where to get the book. Paste the full https:// address.
            type: string

  # ---------------------------------------------------------------
  - name: faq
    label: "9. Common questions (FAQ)"
    type: file
    path: content/faq.json
    format: json
    fields:
      - name: show
        label: Show this section
        description: Turn off to hide the whole questions section.
        type: boolean
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the questions heading.
        type: string
      - name: heading
        label: Heading
        description: The big heading above the questions.
        type: string
      - name: items
        label: Questions
        type: object
        description: "These also show up in Google results, so phrase questions the way a man would search them."
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Question
            description: The line people click to open the answer.
            type: string
          - name: answer
            label: Answer
            description: Shown when the question is opened. Use **bold** or [link text](https://...).
            type: text

  # ---------------------------------------------------------------
  - name: closing
    label: "10. Bottom call to action"
    type: file
    path: content/closing.json
    format: json
    fields:
      - name: eyebrow
        label: Small label above the heading
        description: The small all-caps line above the closing heading at the bottom of the page.
        type: string
      - name: heading
        label: Heading
        description: The big heading at the bottom of the page.
        type: string
      - name: text
        label: Paragraph
        description: The paragraph under the closing heading.
        type: text
      - name: primaryButton
        label: Orange button text
        description: Text of the orange button at the bottom of the page.
        type: string
      - name: secondaryButton
        label: Outline button text
        description: Text of the outline button next to it.
        type: string

  # ---------------------------------------------------------------
  - name: settings
    label: "11. Google and sharing"
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: seoTitle
        label: Browser tab and Google title
        type: string
        description: "Under 60 characters. Lead with what men search for, like porn addiction help."
      - name: seoDescription
        label: Google description
        type: text
        description: "The gray text under the title in search results. About 150 to 160 characters."
      - name: shareTitle
        label: Share title
        type: string
        description: "Title shown when the link is shared in a text or on social."
      - name: shareDescription
        label: Share description
        description: The text that appears when the link is shared in a text, email or social post.
        type: text
      - name: shareImage
        label: Share image
        type: image
        description: "1200 x 630 JPG works best. Shows when the link is shared in a text or on social."
