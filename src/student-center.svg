<svg class="building" viewBox="0 118 1200 402" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration of the CCC Student Center entrance at night, with the front doors lit">
  <defs>
    <radialGradient id="sc-glow" cx="590" cy="350" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8017" stop-opacity=".36"/>
      <stop offset=".45" stop-color="#FF8017" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FF8017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC08A"/>
      <stop offset="1" stop-color="#FF8017"/>
    </linearGradient>
    <linearGradient id="sc-walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8017" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FF8017" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sc-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB273" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFB273" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sc-brick" width="22" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 9.5h22M11 0v4.75M0 4.75h22M0 4.75v4.75M22 4.75v4.75" stroke="#FBEFDA" stroke-opacity=".14" stroke-width=".8" fill="none"/>
    </pattern>
  </defs>

  <!-- warm spill of light -->
  <rect y="118" width="1200" height="402" fill="url(#sc-glow)"/>

  <g stroke="#FBEFDA" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- ground -->
    <path d="M0 411h1200" stroke-opacity=".35" stroke-width="1.2"/>

    <!-- main building body -->
    <rect x="40" y="214" width="1130" height="197" fill="#141936" stroke-opacity=".5" stroke-width="1.4"/>
    <!-- upper fascia panels -->
    <path d="M40 291h1130" stroke-opacity=".3" stroke-width="1"/>
    <path d="M160 214v77M280 214v77M800 214v77M905 214v77M1010 214v77M1110 214v77" stroke-opacity=".13" stroke-width="1"/>
    <!-- window bands -->
    <rect x="52" y="295" width="290" height="50" fill="#0B0E20" stroke-opacity=".3" stroke-width="1"/>
    <rect x="742" y="295" width="418" height="50" fill="#0B0E20" stroke-opacity=".3" stroke-width="1"/>
    <path d="M100 295v50M148 295v50M196 295v50M244 295v50M292 295v50" stroke-opacity=".18" stroke-width="1"/>
    <path d="M790 295v50M838 295v50M886 295v50M934 295v50M982 295v50M1030 295v50M1078 295v50M1124 295v50" stroke-opacity=".18" stroke-width="1"/>
    <!-- a few lit windows -->
    <rect x="935" y="296" width="46" height="48" fill="#FF8017" fill-opacity=".13" stroke="none"/>
    <rect x="197" y="296" width="46" height="48" fill="#FF8017" fill-opacity=".09" stroke="none"/>
    <!-- brick base -->
    <rect x="40" y="345" width="1130" height="66" fill="url(#sc-brick)" stroke="none"/>
    <path d="M40 345h1130" stroke-opacity=".3" stroke-width="1"/>

    <!-- brick tower (behind the sign panel) -->
    <rect x="396" y="170" width="90" height="241" fill="#1A1F44" stroke-opacity=".55" stroke-width="1.4"/>
    <rect x="396" y="170" width="90" height="241" fill="url(#sc-brick)" stroke="none"/>
    <path d="M393 170h96" stroke-opacity=".6" stroke-width="2"/>

    <!-- concrete sign panel, in front of the tower's left edge -->
    <path d="M340 228h98v183h-98z" fill="#222851" stroke-opacity=".6" stroke-width="1.4"/>
    <path d="M340 312 438 284M340 338 438 304M356 411 438 258" stroke-opacity=".22" stroke-width="1"/>

    <!-- canopy -->
    <path d="M478 222h272v36H478z" fill="#0B0E20" stroke-opacity=".6" stroke-width="1.4"/>
    <path d="M486 258h258" stroke="#FFB273" stroke-opacity=".45" stroke-width="1.2"/>
    <path d="M486 259h258l-14 50H500z" fill="url(#sc-down)" stroke="none"/>
    <circle cx="530" cy="257" r="2" fill="#FFB273" stroke="none"/>
    <circle cx="614" cy="257" r="2" fill="#FFB273" stroke="none"/>
    <circle cx="698" cy="257" r="2" fill="#FFB273" stroke="none"/>

    <!-- glass storefront -->
    <rect x="486" y="262" width="213" height="149" fill="#0B0E20" stroke-opacity=".4" stroke-width="1"/>
    <rect x="490" y="266" width="205" height="145" fill="url(#sc-door)" fill-opacity=".88" stroke="none"/>
    <!-- transom and mullions -->
    <path d="M490 300h205M524 266v145M558 266v145M592 266v145M626 266v145M660 266v145" stroke="#0A0D1C" stroke-opacity=".55" stroke-width="2.4"/>
    <!-- center doors -->
    <path d="M558 300h68v111h-68z" stroke="#0A0D1C" stroke-opacity=".75" stroke-width="2.4"/>
    <path d="M586 350v16M598 350v16" stroke="#0A0D1C" stroke-opacity=".8" stroke-width="2.4"/>

    <!-- right brick pillar -->
    <rect x="699" y="262" width="42" height="149" fill="#1A1F44" stroke-opacity=".55" stroke-width="1.4"/>
    <rect x="699" y="262" width="42" height="149" fill="url(#sc-brick)" stroke="none"/>

    <!-- wall lamps on tower and pillar -->
    <rect x="456" y="302" width="6" height="16" rx="2" fill="#FFB273" stroke="none"/>
    <rect x="717" y="302" width="6" height="16" rx="2" fill="#FFB273" stroke="none"/>
    <circle cx="459" cy="310" r="15" fill="#FF8017" fill-opacity=".16" stroke="none"/>
    <circle cx="720" cy="310" r="15" fill="#FF8017" fill-opacity=".16" stroke="none"/>

    <!-- walkway with light spill -->
    <path d="M514 411h168l130 109H378z" fill="url(#sc-walk)" stroke="none"/>
    <path d="M514 411 378 520M682 411l130 109" stroke-opacity=".3" stroke-width="1.2"/>
    <path d="M478 452h244M446 486h306" stroke-opacity=".12" stroke-width="1"/>

    <!-- shrubs -->
    <path d="M60 411c4-14 16-20 28-16 6-12 22-14 30-4 10-8 24-6 30 6 8-4 20-2 24 8" fill="#10142C" stroke-opacity=".38" stroke-width="1.2"/>
    <path d="M296 411c0-14 10-24 24-23 4-13 20-19 32-11 8-9 24-8 30 3 10-4 22 2 24 12 8 0 14 8 14 19z" fill="#10142C" stroke-opacity=".4" stroke-width="1.2"/>
    <path d="M440 411c0-10 8-17 18-16 5-8 17-10 24-3 8-3 18 3 18 13v6z" fill="#10142C" stroke-opacity=".4" stroke-width="1.2"/>
    <path d="M748 411c6-14 20-18 30-10 8-10 26-8 32 4 10-6 24-2 28 8" fill="#10142C" stroke-opacity=".4" stroke-width="1.2"/>
    <path d="M846 411c4-12 18-16 28-10 8-10 24-8 30 2 10-6 24-2 28 8" fill="#10142C" stroke-opacity=".38" stroke-width="1.2"/>
    <path d="M940 411c4-12 18-16 28-10 8-10 24-8 30 2 10-6 24-2 28 8" fill="#10142C" stroke-opacity=".38" stroke-width="1.2"/>
    <path d="M1034 411c4-12 18-16 28-10 8-10 24-8 30 2 10-6 24-2 28 8" fill="#10142C" stroke-opacity=".38" stroke-width="1.2"/>

    <!-- tree, left -->
    <path d="M118 411c2-44 2-88 0-130" stroke-opacity=".5" stroke-width="2.2"/>
    <path d="M118 330c-14-12-28-16-40-14M118 306c14-14 30-18 44-14" stroke-opacity=".4" stroke-width="1.4"/>
    <path d="M120 128c-38 0-64 24-66 52-28 6-44 32-38 60 4 26 28 44 54 44 12 18 30 24 50 20 20 6 42-2 52-20 28-2 50-24 50-52 0-26-18-46-42-52-4-30-30-52-60-52z" fill="#10142C" stroke-opacity=".5" stroke-width="1.4"/>
    <path d="M74 210c10-10 26-16 38-12M142 190c14-4 28 0 36 10M90 262c14 6 28 6 40 0M150 250c12 4 24 2 32-6" stroke-opacity=".22" stroke-width="1.2"/>

    <!-- bollard -->
    <path d="M776 474v-50" stroke-opacity=".45" stroke-width="6"/>
    <circle cx="776" cy="424" r="2.5" fill="#FFB273" stroke="none"/>
  </g>

  <!-- sign lettering -->
  <g font-family="proxima-nova, 'Helvetica Neue', Arial, sans-serif" font-weight="600" fill="#FBEFDA" fill-opacity=".88">
    <text x="351" y="258" font-size="15">Student</text>
    <text x="351" y="276" font-size="15">Center</text>
  </g>
</svg>
